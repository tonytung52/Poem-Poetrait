<title>素中藏錦 肖像 3D 版</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
:root{--gold:#f3d27a;--mute:#c8b995;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#0b1020;overflow:hidden;font:15px/1.7 "Noto Serif TC","Songti TC","PMingLiU",serif;color:#efe3c8}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
header{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 22px;text-align:center;background:linear-gradient(rgba(6,8,16,.65),transparent);pointer-events:none}
h1{font-size:30px;font-weight:900;letter-spacing:.24em;background:linear-gradient(90deg,#b8862b,#fff1b8,#b8862b,#fff1b8) 0 0/300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 12s linear infinite}
@keyframes shine{to{background-position:-300% 0}}
header p{font-size:12px;color:var(--mute)}
#card{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:min(92vw,560px);padding:3px;border-radius:16px;background:conic-gradient(from var(--ang),#2a1d0a 0 62%,#e8a33a 82%,#fff1b8 90%,#2a1d0a 100%);animation:spin 7s linear infinite}
@keyframes spin{to{--ang:360deg}}
.in{background:rgba(14,10,6,.9);border-radius:13px;padding:12px 16px}
#ln{font-size:24px;font-weight:700;letter-spacing:.14em;color:var(--gold)}
#gl{font-size:13px;color:var(--mute);margin:2px 0 8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
nav{display:flex;gap:8px}
button{font:inherit;font-size:14px;color:var(--gold);background:transparent;border:1px solid #6e5620;border-radius:999px;min-width:40px;height:34px;padding:0 12px;cursor:pointer}
button.on{background:#e8a33a;color:#1a1005;border-color:#e8a33a}
#err{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:24px}
@media (prefers-reduced-motion:reduce){h1,#card{animation:none}}

 L:'乾坤隱市豈無功',G:'渾天星環藏在市集屋簷之後，功業在人間煙火裡。'},
{bg:C('#0b0716'),tint:C('#d2bcff'),cam:new T.Vector3(-2.2,2,6.4),look:new T.Vector3(0,2.5,-1.5),ry:.18,
 L:'世人只識浮華味',G:'煙火一閃即逝，人人仰頭，只看得見最亮的一瞬。'},
{bg:C('#2a1608'),tint:C('#ffdca8'),cam:new T.Vector3(1.4,1.8,6.6),look:new T.Vector3(1.2,1.4,0),ry:-.2,
 L:'誰曉醇厚琥珀濃',G:'琥珀蜜釀緩緩旋動，一滴落下，漣漪久久不散。'}];
let cur=0,yaw=0,drag=false,auto=true,last=0,hold=0,tt=0;
const cp=ST[0].cam.clone(),cl=ST[0].look.clone(),dots=$('dots');
ST.forEach((s,i)=>{const b=document.createElement('button');b.textContent='一二三四'[i];b.setAttribute('aria-label','第'+(i+1)+'格');b.onclick=()=>{go(i);hold=8};dots.appendChild(b)});
function go(i){cur=i;[...dots.children].forEach((b,j)=>b.classList.toggle('on',j==i));
$('ln').textContent=ST[i].L;$('gl').textContent=ST[i].G;
g0.visible=i==0;g1.visible=i==1;fire.visible=i==2;g3.visible=gl3.visible=i==3}
go(0);
$('ap').onclick=()=>{auto=!auto;$('ap').textContent=auto?'暫停':'自動播放'};
if(RM){auto=false;$('ap').textContent='自動播放'}
const cv=$('c');let px=0;
cv.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;cv.setPointerCapture(e.pointerId);hold=8});
cv.addEventListener('pointermove',e=>{if(drag){yaw=Math.max(-.45,Math.min(.45,yaw+(e.clientX-px)*.007));px=e.clientX}});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,()=>drag=false));

function frame(ms){requestAnimationFrame(frame);
const dt=Math.min(.05,(ms-last)/1000||0);last=ms;tt+=dt;const t=tt,S=ST[cur];
if(auto&&!RM){hold-=dt;if(hold<=0){hold=9;go((cur+1)%4)}}
scene.background.lerp(S.bg,.04);scene.fog.color.copy(scene.background);
P.rotation.y+=(S.ry-P.rotation.y)*.04;
if(port){port.material.color.lerp(S.tint,.04);if(!RM){P.scale.y=1+.004*Math.sin(t*1.6);P.rotation.x=Math.sin(t*.5)*.012}}
if(cur==0){const p=.5+.5*Math.sin(t*1.6);bro.material.opacity=.5+.5*p;bro.rotation.z=t*.15;gl0.intensity=.6+1.2*p}
if(cur==1){arm1.rotation.y=t*.12;rings.forEach((r,i)=>r.rotation.x+=dt*.2*(i%2?-1:1));lan.forEach((l,i)=>l.rotation.z=Math.sin(t*1.4+i)*.14)}
if(cur==2){if(t>fn){fn=t+.55+Math.random()*.5;burst()}
for(let i=0;i<N;i++){if(fl[i]>0){fv[i*3+1]-=3*dt;for(let a=0;a<3;a++)fp[i*3+a]+=fv[i*3+a]*dt;fl[i]-=dt*.5}
tc.setHSL(fh[i]%1,1,.6).multiplyScalar(Math.max(fl[i],0));fc.set([tc.r,tc.g,tc.b],i*3)}
fg.attributes.position.needsUpdate=fg.attributes.color.needsUpdate=true}
if(cur==3){jd.forEach((d,i)=>{d.a+=d.s*dt;d.y=(d.y+dt*.06*d.s)%1.1;jp.set([Math.cos(d.a)*d.r,.1+d.y,Math.sin(d.a)*d.r],i*3)});jg.attributes.position.needsUpdate=true;
const ph=t%3;drop.visible=ph<.8;drop.position.y=3-(ph/.8)**2*1.75;
const q=Math.max(0,ph-.8);rip.visible=ph>.8;rip.scale.set(.05+q*.4,.05+q*.4,1);rip.material.opacity=Math.max(0,1-q/1.6);gl3.intensity=1.2+.3*Math.sin(t*2)}
cp.lerp(S.cam,.035);cl.lerp(S.look,.035);
const o=cp.clone().sub(cl),y=yaw+(drag||RM?0:Math.sin(t*.25)*.14),cs=Math.cos(y),sn=Math.sin(y);
cam.position.set(cl.x+o.x*cs+o.z*sn,cp.y,cl.z-o.x*sn+o.z*cs);cam.lookAt(cl);
ren.render(scene,cam)}
requestAnimationFrame(frame);
}catch(e){document.getElementById('err').style.display='grid'}
